<!-- ===================== SLIDE 05 · FEATURED WEB PROJECTS ===================== -->
<section class="slide slide--green s-featured" id="projects" data-title="Featured Web Projects">
  <style>
    .s-featured .featured__title { color: #fff; }
    .s-featured .featured__next {
      display: grid;
      place-items: center;
      width: calc(188 * var(--u));
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--green-dark);
      color: #1fa52f;
      transition: transform .4s var(--ease-out), color .3s;
    }
    .s-featured .featured__next svg { width: 52%; animation: nudge 2.2s ease-in-out infinite; }
    .s-featured .featured__next:hover { transform: scale(1.06); color: #fff; }
    @keyframes nudge { 0%, 100% { translate: 0 0; } 50% { translate: 10% 0; } }

    @media (max-width: 860px), (max-aspect-ratio: 4/5) {
      .s-featured { align-items: center; text-align: center; }
      .s-featured .featured__title { font-size: clamp(48px, 15vw, 88px); }
      .s-featured .featured__art { width: min(80vw, 420px); }
      .s-featured .featured__next { width: 84px; }
    }
  </style>
